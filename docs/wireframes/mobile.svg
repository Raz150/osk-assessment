<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 3000" font-family="Arial, sans-serif" font-size="14">
  <title>Gameweek Club mobile wireframe (375px)</title>
  <style>
    .box{fill:#f2f2f2;stroke:#888;stroke-width:1.5}
    .ph{fill:#d9d9d9;stroke:#888;stroke-width:1}
    .cta{fill:#333}
    .ctat{fill:#fff;font-weight:bold}
    .h{font-weight:bold;font-size:18px}
    .lbl{fill:#666;font-size:12px}
    .flow{fill:#c00;font-weight:bold;font-size:16px}
  </style>
  <rect width="375" height="3000" fill="#fff"/>

  <!-- Header -->
  <rect class="box" x="0" y="0" width="375" height="60"/>
  <text class="h" x="16" y="37">GAMEWEEK CLUB</text>
  <rect class="ph" x="291" y="12" width="68" height="36"/><text x="303" y="35">Menu</text>
  <text class="lbl" x="16" y="56">nav collapses behind Menu button</text>

  <!-- Hero -->
  <rect class="box" x="0" y="60" width="375" height="400"/>
  <text class="lbl" x="16" y="96">MSL · Liga Pusingan Kedua</text>
  <text class="h" x="16" y="134" font-size="28">Missed the start?</text>
  <text class="h" x="16" y="170" font-size="28">Join the second</text>
  <text class="h" x="16" y="206" font-size="28">half.</text>
  <text x="16" y="244">Short intro paragraph</text>
  <rect class="cta" x="16" y="276" width="343" height="52" rx="4"/><text class="ctat" x="110" y="308">Register interest →</text>
  <text x="130" y="356">See the formats</text>
  <text class="flow" x="2" y="308">1</text>
  <rect class="ph" x="16" y="376" width="343" height="70"/><text class="lbl" x="110" y="416">illustration (small)</text>

  <!-- How it works -->
  <rect class="box" x="0" y="460" width="375" height="420"/>
  <text class="h" x="16" y="500">How it works</text>
  <rect class="ph" x="16" y="520" width="343" height="105"/><text x="30" y="550">1. Register interest</text>
  <rect class="ph" x="16" y="635" width="343" height="105"/><text x="30" y="665">2. Get your league code</text>
  <rect class="ph" x="16" y="750" width="343" height="105"/><text x="30" y="780">3. Play the second round</text>
  <text class="lbl" x="30" y="600">cards stack</text>

  <!-- Formats -->
  <rect class="box" x="0" y="880" width="375" height="520"/>
  <text class="h" x="16" y="920">Choose your format</text>
  <rect class="ph" x="16" y="940" width="114" height="44"/><text x="34" y="967">Classic</text>
  <rect class="ph" x="130" y="940" width="114" height="44" fill="#fff"/><text x="140" y="967">H2H</text>
  <rect class="ph" x="244" y="940" width="115" height="44" fill="#fff"/><text x="254" y="967">Beginners</text>
  <text class="lbl" x="16" y="1000">tabs fit in one row; labels wrap if needed</text>
  <rect class="ph" x="16" y="1010" width="343" height="360" fill="#fff"/>
  <text x="30" y="1045">Panel facts list</text>
  <rect class="cta" x="30" y="1300" width="315" height="50" rx="4"/><text class="ctat" x="90" y="1331">Choose this format →</text>
  <text class="flow" x="2" y="967">2</text>

  <!-- Dates -->
  <rect class="box" x="0" y="1400" width="375" height="360"/>
  <text class="h" x="16" y="1440">Key dates</text>
  <rect class="ph" x="16" y="1460" width="343" height="64"/>
  <rect class="ph" x="16" y="1532" width="343" height="64"/>
  <rect class="ph" x="16" y="1604" width="343" height="64"/>
  <rect class="ph" x="16" y="1676" width="343" height="64"/>
  <text class="lbl" x="30" y="1496">vertical timeline</text>

  <!-- Charity -->
  <rect class="box" x="0" y="1760" width="375" height="340"/>
  <text class="h" x="16" y="1800">Where your entry goes</text>
  <text x="16" y="1828">Short paragraph</text>
  <rect class="ph" x="16" y="1848" width="343" height="72"/>
  <rect class="ph" x="16" y="1928" width="343" height="72"/>
  <rect class="ph" x="16" y="2008" width="343" height="72"/>

  <!-- Register -->
  <rect class="box" x="0" y="2100" width="375" height="560"/>
  <text class="h" x="16" y="2140">Register interest</text>
  <text class="lbl" x="16" y="2162">DEMO: nothing is sent or stored</text>
  <rect class="ph" x="16" y="2180" width="343" height="44" fill="#fff"/><text x="28" y="2207">Name *</text>
  <rect class="ph" x="16" y="2236" width="343" height="44" fill="#fff"/><text x="28" y="2263">Email *</text>
  <rect class="ph" x="16" y="2292" width="343" height="44" fill="#fff"/><text x="28" y="2319">Team name *</text>
  <rect class="ph" x="16" y="2348" width="343" height="44" fill="#fff"/><text x="28" y="2375">Format * ▾</text>
  <text x="28" y="2420">Experience ○ ○ ○</text>
  <text x="28" y="2452">☐ I agree to the league rules *</text>
  <text class="lbl" x="28" y="2480">full-width fields, errors under fields</text>
  <rect class="cta" x="16" y="2500" width="343" height="52" rx="4"/><text class="ctat" x="110" y="2532">Register interest</text>
  <text class="flow" x="2" y="2532">3</text>

  <!-- FAQ -->
  <rect class="box" x="0" y="2660" width="375" height="220"/>
  <text class="h" x="16" y="2700">FAQ</text>
  <rect class="ph" x="16" y="2716" width="343" height="44" fill="#fff"/><text x="28" y="2743">▸ Never played?</text>
  <rect class="ph" x="16" y="2768" width="343" height="44" fill="#fff"/><text x="28" y="2795">▸ Entry fee?</text>
  <rect class="ph" x="16" y="2820" width="343" height="44" fill="#fff"/><text x="28" y="2847">▸ …</text>

  <!-- Footer -->
  <rect class="box" x="0" y="2880" width="375" height="120" fill="#ddd"/>
  <text x="16" y="2920">Wordmark · contact · credits</text>
  <text x="16" y="2944">Not-affiliated disclaimer</text>
  <text class="lbl" x="16" y="2976">Flow: 1 hero CTA → 2 format → 3 register</text>
</svg>
